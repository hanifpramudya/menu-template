<script>
  function applyLanguage() {
    MENU.forEach(item => {
      const trItem = window.translations.menu?.[item.id];
      if (!trItem) return;

      if (trItem.name) {
        item.name = {
          ...item.name,
          [window.currentLang]: trItem.name
        };
      }

      if (trItem.desc) item.desc = trItem.desc;
      if (trItem.ingredients) item.ingredients = trItem.ingredients;
    });
  }
</script>

<script>
/* ----------------------------------------------

---------------------------------------------- */

// ✨ CATS will be loaded from Excel
let CATS = {};

// ✨ MENU will be loaded from Excel
let MENU = [];

// Google Sheets API endpoint (disabled until available)
const ENABLE_REMOTE_API = false;
const MENU_API_BASE =
  "https://script.google.com/macros/s/AKfycbwYZEWwZ0XXGW2_DklLZm1EJKI_T-xaGNfSviOgELeVgW1rLBxpROZPqbSqkTVr-H4/exec";

/**
 * Load menu data from Google Sheets using JSONP
 * Expected response format:
 * {
 *   ok: true,
 *   categories: { hot: "SICAK İÇECEKLER", cold: "SOĞUK İÇECEKLER", ... },
 *   items: [
 *     { id: "cay", cat: "hot", name: "Çay", price: 60, img: "images/cay.webp", active: true },
 *     { id: "espresso", cat: "coffees", name: "Espresso", sizes: {S: 140, M: 160}, ... },
 *     ...
 *   ]
 * }
 */
function loadMenuJSONP() {
  return new Promise((resolve, reject) => {
    const cbName = "__menu_cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");

    window[cbName] = (data) => {
      cleanup();
      resolve(data);
    };

    function cleanup() {
      try { delete window[cbName]; } catch {}
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    script.onerror = () => {
      cleanup();
      reject(new Error("JSONP load failed"));
    };

    // Request both categories and menu items
    const url = `${MENU_API_BASE}?activeOnly=0&includeCategories=1&callback=${cbName}&t=${Date.now()}`;
    script.src = url;
    document.head.appendChild(script);
  });
}

// Local JSON fallback (data/menu.json + data/categories.json)
async function loadMenuFromLocalJSON() {
  const [catsRes, menuRes] = await Promise.all([
    fetch("./data/categories.json", { cache: "no-store" }),
    fetch("./data/menu.json", { cache: "no-store" })
  ]);

  if (!catsRes.ok || !menuRes.ok) {
    throw new Error(`Local JSON fetch failed: ${catsRes.status}/${menuRes.status}`);
  }

  const categories = await catsRes.json();
  const items = await menuRes.json();

  return {
    ok: true,
    categories,
    items
  };
}

/**
 * Apply data from Excel to CATS and MENU
 */
function applyRemoteData(data) {
  if (!data?.ok) {
    console.error("❌ Bad API data structure");
    return false;
  }

  // Load categories
  if (data.categories && typeof data.categories === "object") {
    CATS = { ...data.categories };
    console.log("✅ Categories loaded from Excel:", Object.keys(CATS).length);
  }

  // Load menu items
  if (Array.isArray(data.items) && data.items.length > 0) {
    MENU = data.items.map(item => {
      // Parse sizes if it's a string (from Excel)
      if (typeof item.sizes === 'string') {
        try {
          item.sizes = JSON.parse(item.sizes);
        } catch (e) {
          console.warn(`Failed to parse sizes for ${item.id}:`, item.sizes);
        }
      }
      
      // Parse ingredients if it's a string
      if (typeof item.ingredients === 'string') {
        try {
          item.ingredients = JSON.parse(item.ingredients);
        } catch (e) {
          item.ingredients = item.ingredients.split(',').map(s => s.trim());
        }
      }
      
      // Ensure active flag is boolean
      item.active = item.active !== false && item.active !== 0 && item.active !== "false";
      
      return item;
    });
    
    console.log("✅ Menu items loaded from Excel:", MENU.length);
    return true;
  }

  console.error("❌ No menu items in response");
  return false;
}

<script>
    /* ----------------------------------------------
        UI helpers
    ---------------------------------------------- */
    const root = document.getElementById("root");
    let active = Object.keys(CATS)[0] || "hot"; // Default to first category

    // i18n mini-API
    const fmt = n =>
      new Intl.NumberFormat("tr-TR", {
        style: "currency",
        currency: "TRY",
        maximumFractionDigits: 0
      }).format(n);

    // genel ceviri (once JSON, sonra ENRICH, sonra fallback)
    function t(id, fallback) {
      return window.translations?.menu?.[id]
          || window.translations?.[id]
          || AMOUR_ENRICH?.[id]?.name
          || fallback;
    }

    // ---------- i18n yardimcilari ----------
    function getName(item) {
      const base = typeof item.name === "object" ? { ...item.name } : { tr: item.name };
      const fromJson = window.translations?.menu?.[item.id]?.name;
      if (fromJson) base.en = fromJson;
      return base[window.currentLang] || base.tr || "";
    }

    function getDesc(id) {
      return window.translations?.menu?.[id]?.desc
          || AMOUR_ENRICH?.[id]?.desc
          || "";
    }

    function getIngredients(id) {
      return window.translations?.menu?.[id]?.ingredients
          || AMOUR_ENRICH?.[id]?.ingredients
          || [];
    }

    function formatPrice(item) {
      if (typeof item.price === "number") return fmt(item.price);

      const sizes = item.sizes || item.price;
      if (sizes?.S && sizes?.M) return `S ${fmt(sizes.S)} / M ${fmt(sizes.M)}`;
      if (typeof sizes?.S === "number") return `S ${fmt(sizes.S)}`;
      if (typeof sizes?.M === "number") return `M ${fmt(sizes.M)}`;

      return "";
    }

    //  kategori metinleri icin tek kaynak (genel)
    function catTitle(key) {
      if (window.translations && window.translations[key]) return window.translations[key];

      const base = CATS[key];
      if (typeof base === "string") return base;

      const tr = CATS[key]?.tr;
      const en = CATS[key]?.en;

      if (window.currentLang === "en" && en) return en;
      return tr || en || key;
    }

    function renderCard(item) {
      const price = formatPrice(item);

      const name = getName(item);

      const card = document.createElement("article");
      card.className = "card overflow-hidden reveal cursor-pointer";
      card.onclick = () => openModal(item.id);

      card.innerHTML = `
        <img class="img" src="${item.img}">
        <div class="p-3 flex justify-between text-sm">
          <span>${name}</span>
          <span>${price}</span>
        </div>
      `;
      return card;
    }

	function layout(items) {
	  const wrap = document.createElement("div");
	  wrap.className = "max-w-6xl mx-auto grid grid-cols-12 gap-2 p-2";

	  //  Sol menu (her zaman)
	  const aside = document.createElement("aside");
	  aside.className = `
		col-span-4 sm:col-span-3 
		sticky top-20 
		space-y-1
	  `;

	  Object.keys(CATS).forEach(key => {
		const btn = document.createElement("button");
		btn.className = `
		  w-full text-left px-2 py-2 rounded text-xs sm:text-sm transition-colors
		  ${active === key ? "font-semibold" : ""}
		`;
		btn.style.cssText = active === key 
		  ? "background-color: var(--sidebar-button); color: var(--sidebar-text);"
		  : "background-color: transparent; color: var(--text-secondary);";
		
		btn.onmouseover = () => {
		  if (active !== key) btn.style.backgroundColor = "var(--sidebar-hover)";
		};
		btn.onmouseout = () => {
		  if (active !== key) btn.style.backgroundColor = "transparent";
		};

		btn.dataset.cat = key;
		btn.textContent = catTitle(key);
		btn.onclick = () => { active = key; render(); };
		aside.append(btn);
	  });

	  //  Mobil seridi gizle
	  const mobile = document.createElement("div");
	  mobile.className = "hidden";

	  //  Urunler
	  const grid = document.createElement("div");
	  grid.className = `
		col-span-8 sm:col-span-9 
		grid 
		grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 
		gap-2 sm:gap-4
	  `;
	  items.forEach(i => grid.append(i));

	  wrap.append(aside, mobile, grid);
	  return wrap;
	}

</script>



<script>
    function initReveal(){
      document.querySelectorAll('.reveal').forEach(el=>{
        setTimeout(()=>el.classList.add('in'),50);
      });
    }

    const modalEl = document.getElementById("drinkModal");

    function openModal(id) {
      const item = MENU.find(x => x.id === id);
      if (!item) return;

      const name        = getName(item);
      const desc        = getDesc(item.id);
      const ingredients = getIngredients(item.id);
      const caffeine    = item.caffeine || AMOUR_ENRICH[item.id]?.caffeine || null;

      document.getElementById("modalImg").src = item.img;
      document.getElementById("modalName").textContent = name;

      // ✅ JSON icinden UI etiketleri
      const descLabel     = window.translations?.description  || t("desc","Description");
      const ingLabel      = window.translations?.ingredients  || t("ingredients","Ingredients");
      const caffeineLabel = window.translations?.caffeine     || t("caffeine","Caffeine"); // ✅ eklendi

      // ✅ baslik cevirilerini uygula
      document.getElementById("modalIngTitle").textContent = ingLabel;
      document.getElementById("modalDescUI").previousElementSibling.textContent = descLabel;

      const descUI = document.getElementById("modalDescUI");
      descUI.innerHTML = desc
        ? `<span class="px-2 py-1 bg-white/10 rounded">${desc}</span>`
        : "";

      const ingUI = document.getElementById("modalIng");
      ingUI.innerHTML = ingredients.length
        ? ingredients.map(i => `<li>${i}</li>`).join("")
        : `<li>-</li>`;

      const title = document.getElementById("cafTitle");
      const dots  = document.getElementById("cafDots");
      const mg    = document.getElementById("cafMg");

      if (caffeine) {
        title.textContent = caffeineLabel; // ✅ artik var
        title.classList.remove("hidden");
        dots.classList.remove("hidden");
        mg.classList.remove("hidden");

        const level = Math.min(Math.floor(caffeine / 40), 5);
        dots.innerHTML = Array.from({ length: 5 })
          .map((_, i) =>
            `<div class="w-2 h-2 rounded-full ${i < level ? 'bg-green-400' : 'bg-white/30'}"></div>`
          ).join("");

        mg.textContent = `${caffeine} mg`;
      } else {
        title.classList.add("hidden");
        dots.classList.add("hidden");
        mg.classList.add("hidden");
      }

      modalEl.classList.remove("hidden");
    }

    document.getElementById("modalClose").onclick = () =>
      modalEl.classList.add("hidden");

    modalEl.onclick = e => {
      if (e.target === e.currentTarget) modalEl.classList.add("hidden");
    };

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") modalEl.classList.add("hidden");
    });
</script>




<script>
/* ----------------------------------------------
   ilk render
---------------------------------------------- */
async function render(){
  root.innerHTML="";
  
  // If menu is empty, show loading
  if (MENU.length === 0) {
    root.innerHTML = `
      <div class="flex items-center justify-center min-h-screen">
        <div class="text-center">
          <div class="loading-spinner mx-auto mb-4"></div>
          <p class="text-white/60">Menü yükleniyor...</p>
        </div>
      </div>
    `;
    return;
  }
  
  const items = MENU
    .filter(m => m.cat === active && m.active !== false)
    .map(renderCard);
  
  root.append(layout(items));
  initReveal();
}

async function initMenuData(){
  // Prefer local JSON while remote endpoint is disabled
  if (ENABLE_REMOTE_API) {
    try {
      console.log("📡 Loading menu from Excel...");
      const data = await loadMenuJSONP();

      const success = applyRemoteData(data);

      if (!success) {
        throw new Error("Failed to apply remote data");
      }

      if (Object.keys(CATS).length > 0) {
        active = Object.keys(CATS)[0];
      }

      await render();
      console.log("✅ Menu loaded successfully!");
      return;

    } catch (e) {
      console.warn("❗ Remote load failed, falling back to local JSON", e);
    }
  }

  // Local JSON files
  try {
    console.log("📂 Loading menu from local JSON files...");
    const localData = await loadMenuFromLocalJSON();

    const successLocal = applyRemoteData(localData);

    if (!successLocal) {
      throw new Error("Failed to apply local JSON data");
    }

    if (Object.keys(CATS).length > 0) {
      active = Object.keys(CATS)[0];
    }

    await render();
    console.log("✅ Menu loaded from local JSON");

  } catch (err) {
    console.error("❌ Menu could not be loaded from local sources:", err);
    root.innerHTML = `
      <div class="flex items-center justify-center min-h-screen">
        <div class="text-center max-w-md">
          <div class="text-6xl mb-4">⚠️</div>
          <h2 class="text-xl font-semibold text-white mb-2">Menü Yüklenemedi</h2>
          <p class="text-white/60 mb-4">Veriler hem Excel API'den hem de yerel JSON dosyalarından yüklenemedi.</p>
          <button onclick="location.reload()" class="px-6 py-3 bg-white text-black rounded-lg font-semibold hover:bg-white/90 transition">
            Tekrar Dene
          </button>
        </div>
      </div>
    `;
  }
}

</script>

<script>
  (function(){
    const LS_KEY = "lang";
    const modal = document.getElementById("lang-modal");
    const ALWAYS_SHOW_LANG_MODAL = false;

    window.currentLang = localStorage.getItem(LS_KEY) || "id";
    window.translations = {};

    function deepGet(obj, path){
      return path.split(".").reduce((acc, k) => (acc && acc[k] != null) ? acc[k] : undefined, obj);
    }

    async function loadTranslations(lang){
      try{
        const res = await fetch(`./lang/lang-${lang}.json`, { cache: "no-store" });
        window.translations = await res.json();
      } catch(e){
        console.warn("❗ Translation JSON not found:", lang, e);
        window.translations = {};
      }
    }

    function applyI18nToDOM(){
      document.querySelectorAll("[data-i18n-html]").forEach(el=>{
        const key = el.getAttribute("data-i18n-html");
        const val = deepGet(window.translations, key);
        if (typeof val === "string") el.innerHTML = val;
      });

      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.getAttribute("data-i18n");
        const val = deepGet(window.translations, key);
        if (typeof val === "string") el.textContent = val;
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
        const key = el.getAttribute("data-i18n-placeholder");
        const val = deepGet(window.translations, key);
        if (typeof val === "string") el.setAttribute("placeholder", val);
      });

      document.querySelectorAll("[data-i18n-title]").forEach(el=>{
        const key = el.getAttribute("data-i18n-title");
        const val = deepGet(window.translations, key);
        if (typeof val === "string") el.setAttribute("title", val);
      });
    }

    function setDirForLang(lang){
      const isRTL = (lang === "ar" || lang === "fa");
      document.documentElement.setAttribute("dir", isRTL ? "rtl" : "ltr");
      document.body.classList.toggle("rtl", isRTL);
    }

    async function setLanguage(lang){
      window.currentLang = lang;
      localStorage.setItem(LS_KEY, lang);

      setDirForLang(lang);
      await loadTranslations(lang);
      applyI18nToDOM();

      if (typeof applyLanguage === "function") applyLanguage();
      if (typeof initMenuData === "function") await initMenuData();

      if (modal) modal.classList.add("hidden");
    }

    function openModal(){
      if (modal) modal.classList.remove("hidden");
    }

    // Make openLangModal available globally
    window.openLangModal = openModal;

    document.querySelectorAll(".lang-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> setLanguage(btn.dataset.lang));
    });

    document.addEventListener("DOMContentLoaded", async ()=>{
      setDirForLang(window.currentLang);
      await loadTranslations(window.currentLang);
      applyI18nToDOM();
      if (typeof applyLanguage === "function") applyLanguage();
      
      // Initialize menu data from Excel
      await initMenuData();

      if (ALWAYS_SHOW_LANG_MODAL || !localStorage.getItem(LS_KEY)) {
        openModal();
      } else if (modal) {
        modal.classList.add("hidden");
      }
    });

    window.addEventListener("pageshow", function(event) {
      if (event.persisted) location.reload();
    });
  })();
</script>
